[project]
name = "tenk"
version = "0.1.0"
description = "Ask questions about SEC 10-K filings and get cited answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyarrow>=17",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
tenk = "tenk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenk"]

[dependency-groups]
dev = ["pytest>=8"]
