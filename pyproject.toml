[project]
name = "aiwash"
version = "0.1.0"
description = "Scores AI claims in SEC 10-K filings: concrete, vague, risk, or context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyarrow>=17",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "fastembed>=0.4",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# CPU-only torch keeps the install around 1 GB instead of 5
finetune = ["torch>=2.4", "transformers>=4.44"]

[project.scripts]
aiwash = "aiwash.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiwash"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8"]
