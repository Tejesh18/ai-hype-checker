[project]
name = "receipts"
version = "0.1.0"
description = "Does a company's AI talk have receipts? Scores AI claims in SEC 10-K filings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyarrow>=17",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "fastembed>=0.4",
]

[project.scripts]
receipts = "receipts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipts"]

[dependency-groups]
dev = ["pytest>=8"]
